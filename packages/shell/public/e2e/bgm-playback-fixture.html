<!doctype html>
<html lang="en"><meta charset="utf-8" /><title>Naia BGM E2E fixture</title>
<body>
<button id="report-playing" type="button">Report playing</button>
<button id="report-ended" type="button">Report ended</button>
<script>
(() => {
 // The host window and the origin are captured at load time on purpose. When
 // the Shell swaps to the next track React replaces the whole iframe element
 // (key={backgroundVideoUrl}), so this document is detached and `parent`
 // is no longer reachable through the live DOM. S-RADIO-DJ-1 needs exactly
 // that detached frame to still be able to deliver a late error.
 const host = parent;
 const origin = window.location.origin;
 const send = (event, info) => host.postMessage(JSON.stringify({ event, info }), origin);
 let handshakeComplete = false;
 let stateSubscribed = false;
 let errorSubscribed = false;
 window.addEventListener('message', (event) => {
  try {
   const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
   if (!data || typeof data !== 'object') return;
   if (data.event === 'listening' && !handshakeComplete) {
    handshakeComplete = true;
    send('initialDelivery', 0);
    send('onReady', null);
    return;
   }
   if (data.event === 'command' && data.func === 'addEventListener' && Array.isArray(data.args)) {
    if (data.args[0] === 'onStateChange') stateSubscribed = true;
    if (data.args[0] === 'onError') errorSubscribed = true;
   }
  } catch {}
 });
 document.querySelector('#report-playing').addEventListener('click', () => {
  if (!handshakeComplete) return;
  send('onStateChange', 1);
 });
 document.querySelector('#report-ended').addEventListener('click', () => {
  if (!handshakeComplete) return;
  send('onStateChange', 0);
 });
 // Late-error path. The spec grabs this function while the frame is still the
 // active background iframe and calls it after the Shell has moved on, which
 // reproduces "track A reports an error after B took over".
 window.__naiaE2eReportLateError = (reason) => send('onError', reason ?? 'fixture_late_error');
 window.__naiaE2eHandshakeState = () => ({ handshakeComplete, stateSubscribed, errorSubscribed });
})();
</script>
</body></html>
