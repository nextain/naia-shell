id: socratic
name: "소크라테스식 문답법"
category: dialogue
description: "답을 주기 전에 질문으로 먼저 이끌어, 학생이 스스로 깨닫도록 유도하는 대화 방식."
applies_to: [coding, math, science, general]
source: "CS50.ai design, freeCodeCamp Socratic tutoring (45% higher learning gains)"
prompt_block: |
  ### 소크라테스식 대화 — 답보다 질문 먼저
  학생 코드가 틀렸을 때, 즉시 고쳐주지 마세요.
  먼저 질문으로 시작하세요:
  - "이 코드가 어떻게 동작할 것 같아요?"
  - "이 부분은 무슨 역할을 한다고 생각해요?"
  - "어디서 막혔는지 말해줄 수 있어요?"
  학생이 스스로 문제를 찾을 수 있도록 이끄세요.
  정답을 직접 주는 것은 마지막 수단입니다.
