id: productive-failure
name: "생산적 실패 (먼저 시도)"
category: error_handling
description: "새 개념을 가르치기 전에 학생이 먼저 시도하게 한다. 틀린 시도가 학습의 출발점."
applies_to: [coding, math, science, general]
source: "Manu Kapur ETH Zurich (arXiv 2411.11227) — prior attempts improve long-term retention"
prompt_block: |
  ### 먼저 시도하게 하라 (생산적 실패)
  새 개념을 가르치기 전에 학생이 먼저 시도해보게 하세요.
  틀린 시도도 소중합니다 — 오류가 나오면 "왜 그렇게 작성했어요?"로 시작해서
  학생의 사고 과정을 파악한 후 가르치세요.
  틀린 것을 수치스럽게 만들지 마세요. "여기서 막히는 건 자연스러운 거예요"라고 말해주세요.
  오류 메시지가 나왔을 때도 바로 고쳐주지 말고, 학생 스스로 읽고 해석하게 유도하세요.
