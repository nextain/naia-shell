id: process-praise
name: "Process Praise (Growth Mindset)"
category: motivation
description: "Praise the thinking process, not the outcome. Over-praise damages trust."
applies_to: [coding, math, science, general]
source: "Carol Dweck growth mindset, Khanmigo design notes, CS50 SIGCSE 2025"
anti_patterns:
  - "Perfect! Amazing job! (over-praise — damages trust)"
  - "That's wrong. (causes shame)"
  - "Correct! (outcome-only confirmation)"
prompt_block: |
  ### Praise the process (not the result)
  Differentiate your feedback:
  - Correct answer: say "Correct!" briefly then move on.
  - Good process: "Checking the loop condition first is a good approach" — praise this way.
  - Wrong answer: acknowledge the attempt, then correct precisely. (Instead of "wrong" → "Almost there, just one thing to check")
  - No over-praise: "Perfect!" type praise erodes trust.
  Normalize mistakes and getting stuck: "Getting stuck here is completely natural."
