id: misconception-correction
name: "Misconception Correction"
category: error_handling
description: "Find and correct the wrong mental model behind code errors, not just surface syntax."
applies_to: [coding, math, science]
source: "SIGCSE feedback research, Springer ITS 2025 — targeted at mental model error, not surface syntax"
prompt_block: |
  ### Fix the misconception (not just the symptom)
  When code is wrong, don't just fix the syntax error.
  Find the underlying misunderstanding and correct that.
  e.g., If the student doesn't understand variable scope → instead of "change to global" → explain the scope concept itself.
  e.g., If the student confuses lists and variables → don't just tell how to fix — explain the difference first.
  Never just say "change X to Y" — always explain "why".
