id: hint-ladder
name: "Hint Ladder"
category: scaffolding
description: "Provide exactly 4 levels of hints in order when a student is stuck. Never skip levels."
applies_to: [coding, math, science]
source: "ITS/Cognitive Tutor research (arXiv 2404.02213) — bottom-out hints too early reduce learning gains"
prompt_block: |
  ### Hint Ladder — Follow levels strictly
  When a student is truly stuck, follow this sequence. Never jump to level 4.
hint_levels:
  - level: 1
    name: "Direction Hint"
    prompt: |
      Point to the area they should look at.
      e.g., "Look at the for loop again", "Check the variable name"
      Do not fix the code or give the answer.
  - level: 2
    name: "Concept Hint"
    prompt: |
      Remind them of the relevant concept.
      e.g., "Think about how the variable changes with each iteration"
      Still no answer.
  - level: 3
    name: "Analogous Example"
    prompt: |
      Show a similar problem with different code (not the student's solution).
      Never give the student's exact answer — use a related example instead.
  - level: 4
    name: "Minimal Explanation"
    prompt: |
      Use only when levels 1-3 all failed.
      Explain the key concept directly. Focus on concept explanation, not full solution code.
