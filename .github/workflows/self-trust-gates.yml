# self-trust 게이트 — 원격 CI 강제 레이어.
# 로컬 hook은 1차 마찰일 뿐(bash로 우회 가능). 진짜 강제는 이 CI가 변경 전체를 재계산하는 것.
name: self-trust gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git diff base 계산용 전체 이력

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1) hook 로직 회귀 — 모든 자체 테스트가 통과해야 한다 (하네스가 하네스를 검증)
      - name: hook self-tests
        run: |
          fail=0
          for t in src/test/*.test.mjs; do
            echo "── $t"
            node "$t" || fail=1
          done
          exit $fail

      # 2) self-trust 재검증 — 변경 전체를 재계산 (로컬 hook의 bash 우회를 무력화)
      #    M3 구조 + M2 SDLC + M4 완료증거를 CI에서 다시 본다.
      - name: self-trust re-verification (M3 structure + M2 SDLC + M4 completion)
        env:
          # PR에 'charter-approved' 라벨이 있을 때만 헌장/hook/workflow 변경 허용
          CHARTER_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'charter-approved') && '1' || '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # base가 비었거나 초기 커밋이면 직전 커밋 기준
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          # 공백 포함 파일명 안전 처리 (word-splitting 회피): mapfile로 줄단위 배열
          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD)
          printf '변경 파일: %s\n' "${FILES[@]}"
          if [ ${#FILES[@]} -gt 0 ]; then
            node scripts/ci-verify-structure.mjs "${FILES[@]}"   # M3
            node scripts/ci-verify-sdlc.mjs "${FILES[@]}"        # M2
          else
            echo "변경 파일 없음 — 구조/SDLC 검증 생략"
          fi
          # CI 자가보호: hook/workflow/charter 변경은 사람 승인(CHARTER_APPROVED) 필요
          node scripts/ci-verify-charter.mjs "${FILES[@]}"
          # M4: PR 범위 커밋 '전체'의 완료선언 검사 (codex③: HEAD 1개만 보면 앞 커밋의 무증거 완료선언이 숨는다)
          COMMITS=$(git rev-list "$BASE..HEAD" 2>/dev/null)
          [ -z "$COMMITS" ] && COMMITS=$(git rev-parse HEAD)
          for sha in $COMMITS; do
            echo "── M4 검사 커밋 $sha"
            git log -1 --format=%B "$sha" | node scripts/ci-verify-completion.mjs "${FILES[@]}" || exit 1
          done
          # M5: 음성 경로 증거 — 음성 크리티컬 변경은 Voice-E2E/Voice-Impact 트레일러 필수
          git log --format=%B "$BASE..HEAD" | node scripts/ci-verify-voice-evidence.mjs "${FILES[@]}"

  # 코드 게이트(R0) — 검출자산 전부를 CI 자동실행에 연결한다. 기존 verify 는 구조/헌장/SDLC 메타만
  # 봤고, vitest 계약·통합·tsc·로깅·assembly·file-anchor·wire probe 는 로컬 hook/cron 에만 있어 fork/웹
  # PR 의 코드·계약·타입·계층 드리프트가 자동검출 0 이었다(structure-soundness-review B0). 여기서 닫는다.
  code-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: compile integrity (core + shell tsc)
        run: node scripts/check-compile-integrity.mjs
      - name: production bundle budget
        run: |
          pnpm build
          pnpm -C packages/shell build
      - name: preserve bundle budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-bundle-budget
          path: packages/shell/dist/bundle-budget-report.json
      - name: logging standard (Logger 강제, console.* 금지)
        run: node packages/shell/scripts/check-logging.mjs
      - name: file anchors (src/main 파일단위 계약)
        run: node scripts/check-file-anchors.mjs
      - name: assembly coverage (S/UC 전수분류)
        run: node scripts/check-assembly-coverage.mjs

      # 위 게이트는 옛 `**UC1**` 이름만 본다. 문서가 UC-<이름> 체계로 옮겨간
      # 뒤로 표제를 하나도 보지 못한 채 초록을 보고해 왔다.
      # 이 게이트가 현재 체계를 본다.
      - name: UC traceability
        run: node scripts/check-uc-traceability.mjs

      # 통과 수치가 거짓말하지 않게 한다. expect(true).toBe(true) 는 PASS 로
      # 올라가지만 아무것도 보지 않고, 이유 없이 꺼 둔 테스트는 죽은 채 파일
      # 수에만 남는다.
      - name: vacuous tests (자명 단정·죽은 skip 증가 금지)
        run: node scripts/check-vacuous-tests.mjs

      # 스펙이 늘거나 요구 조건이 바뀌었는데 목록이 그대로면, 그 목록을 보고
      # 기계를 나누는 사람이 없는 스펙을 나누게 된다.
      - name: e2e inventory (실기 스펙 요구조건 목록 최신)
        run: node scripts/build-e2e-inventory.mjs --check

      # 사용성 축은 문구가 아니라 i18n 키로 재기로 했다. 그 선행 작업이
      # 화면에 박힌 한국어를 줄이는 것이고, 이 게이트는 늘어나는 것만 막는다.
      - name: untranslated UI (화면 문자열 하드코딩 증가 금지)
        run: node scripts/check-untranslated-ui.mjs

      # 사용성에서 가장 비싼 실패는 못 쓰는 것이 아니라 되돌릴 수 없게 잃는
      # 것이다. 이 게이트를 처음 돌렸을 때 실제로 그 결함이 있었다 — 대화
      # 삭제에는 확인이 있는데 설치된 앱을 디스크에서 지우는 경로에는 없었다.
      - name: destructive affordance (되돌릴 수 없는 동작에 확인 필수)
        run: node scripts/check-destructive-affordance.mjs

      # 안정성 축의 셋째 질문 — 의존이 죽었을 때 무엇이 보이는가. 문서에는
      # 적혀 있었지만 재는 자리가 없었다. 실패가 화면을 통째로 대신하는
      # 자리에는 빠져나갈 수단이 함께 있어야 한다.
      - name: recovery affordance (막다른 실패 화면 금지)
        run: node scripts/check-recovery-affordance.mjs

      # 화면이 사라져도 그것을 검사하던 스펙은 남는다. 그 실패는 "회귀가
      # 생겼다" 로 읽히지만 실제로는 잴 대상이 없어진 것이다. 실측에서
      # 그런 자리가 열셋 나왔고, 그중 하나는 검증을 통째로 무력화하고
      # 있었다(카드가 0개라 판정이 빈 분기로 흘렀다).
      - name: dead UI specs (사라진 화면을 기다리는 스펙 금지)
        run: node scripts/check-dead-ui-specs.mjs

      # 요소가 없어도 조용히 넘어가는 클릭은 실패를 한 걸음 뒤로 옮긴다.
      # 원인과 증상이 떨어져 있으면 고치는 사람이 엉뚱한 곳을 판다.
      - name: silent clicks (무음 클릭 증가 금지)
        run: node scripts/check-silent-clicks.mjs
      # 정적 게이트가 원리상 다 읽을 수 없는 문법 꼬리(쉼표식·리터럴에 씌운
      # void·리터럴 키 호출)는 게이트를 넓히는 대신 저장소에 못 들어오게 막는다.
      # 목록의 정본은 scripts/lib/lint-boundary-forms.mjs 하나다.
      - name: lint boundary (게이트가 읽지 않기로 한 형태 금지)
        run: node scripts/check-lint-boundary.mjs
      - name: wire probes (os outbound ⊆ agent accept / agent output ⊆ os classify)
        run: |
          node scripts/builds/uc1-outbound-probe.mjs
          node scripts/builds/uc1-variant-probe.mjs
      - name: core tests (vitest)
        run: pnpm test
      - name: shell tests (vitest — unit/contract/integration)
        run: pnpm -C packages/shell test
      - name: install Playwright Chromium
        run: pnpm -C packages/shell exec playwright install --with-deps chromium
      - name: shell browser regression (Playwright)
        run: NAIA_E2E_USE_EXISTING_BUILD=1 pnpm -C packages/shell test:e2e

      # Rust 쪽 테스트 전체가 어디서도 돌지 않고 있었다(발견 당시 285개). 경로 탈출·symlink 거부·포트
      # 회수·샌드박스 동시성처럼 화면으로는 확인할 수 없는 것들이 거기 있다.
      # build.rs 가 페어드 agent 스크립트를 요구하므로 그 경로를 먼저 세운다.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: system deps for tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      # 페어드 agent 는 저장소 밖에 있다. agent-pairing 해석기는 워크트리가
      # 이미 있는 개발 기계를 전제하므로 깨끗한 러너에서는 예외를 던진다.
      # build-installers 가 쓰는 방식(핀 커밋을 얕게 받아 detach)을 그대로 쓴다.
      - name: clone paired naia-agent
        run: |
          git init ../naia-agent
          git -C ../naia-agent remote add origin https://github.com/nextain/naia-agent.git
          git -C ../naia-agent fetch --depth 1 origin 5724389cb219ad41b6a1df5fbf2cbd6a2d48e2d6
          git -C ../naia-agent checkout --detach FETCH_HEAD
      - name: native tests (cargo)
        run: |
          NAIA_AGENT_SCRIPT="$(cd .. && pwd)/naia-agent/scripts/builds/agent-stdio-entry.mjs" \
          NAIA_AGENT_PROTO_DIR="$(cd .. && pwd)/naia-agent/src/main/adapters/grpc" \
            cargo test --manifest-path packages/shell/src-tauri/Cargo.toml --lib

  # 이 워크플로가 붉어도 아무도 몰랐다 — 2026-08-16 이후 20일간 초록이 한 번도 없었고
  # (최근 250회 중 222회 실패) 실패를 사람에게 알리는 단계가 어느 워크플로에도 없었다(#560).
  # 잡 단계 안의 `if: failure()` 는 그 잡 자신의 앞 단계만 본다. 두 잡의 결론을 함께 보려면
  # 두 잡을 needs 로 받는 별도 잡이어야 한다.
  notify-failure:
    needs: [verify, code-gates]
    if: always() && (needs.verify.result == 'failure' || needs.code-gates.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read # 직전 실행 결론 조회(gh run list)
      contents: read
    steps:
      # 시크릿이 없으면 조용히 끝낸다. 알림 잡이 붉어지면 원래 실패를 가린다.
      - name: QA 채널 실패 알림 (Discord)
        env:
          WEBHOOK: ${{ secrets.QA_DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          CODE_GATES_RESULT: ${{ needs.code-gates.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          failed=""
          if [ "$VERIFY_RESULT" = "failure" ]; then failed="verify"; fi
          if [ "$CODE_GATES_RESULT" = "failure" ]; then failed="${failed:+$failed, }code-gates"; fi
          short="$(printf '%.7s' "$SHA")"

          # 연속 붉음 — 같은 문장이 매 커밋 반복되면 곧 무시된다. 직전 실행 결론을 하나 읽어 덧붙인다.
          streak=""
          prev=""
          if prev_json="$(gh run list --workflow self-trust-gates.yml --branch "$BRANCH" \
                --limit 20 --json databaseId,conclusion,status 2>/dev/null)"; then
            prev="$(printf '%s' "$prev_json" | jq -r --arg id "$GITHUB_RUN_ID" \
              '[ .[] | select(.status == "completed") | select((.databaseId | tostring) != $id) ][0].conclusion // ""')"
          fi
          echo "직전 실행 결론 조회: ${prev:-(없음 또는 조회 실패)}"
          case "$prev" in
            failure | timed_out) streak=" / 직전 실행도 실패(연속 붉음)" ;;
            success) streak=" / 직전 실행은 성공" ;;
            *) streak="" ;;
          esac

          msg="[CI self-trust-gates] 실패 — ${failed} 잡 / 브랜치 ${BRANCH} / 커밋 ${short}${streak} / ${RUN_URL}"
          # 한 줄·앞뒤 공백 없음·Discord 2000자 한도 이내로 고정한다.
          msg="$(printf '%s' "$msg" | tr '\n\r\t' '   ' | sed -e 's/  */ /g' -e 's/^ *//' -e 's/ *$//')"
          # 바이트로 자르므로 한글이 중간에서 끊길 수 있다 — iconv -c 로 깨진 꼬리를 떨군다.
          msg="$(printf '%s' "$msg" | head -c 1900 | iconv -c -f UTF-8 -t UTF-8)"

          if [ -z "${WEBHOOK}" ]; then
            echo "webhook 미설정 — 알림을 보내지 못했다 (저장소 시크릿 QA_DISCORD_WEBHOOK 이 비어 있음)."
            echo "보내려던 내용: ${msg}"
            exit 0
          fi

          payload="$(jq -nc --arg c "$msg" '{content: $c, allowed_mentions: {parse: []}}')"
          code="$(curl -sS -o /tmp/discord-response.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK")"
          echo "Discord 응답 코드: ${code}"
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "알림 전송 실패 — 그래도 이 잡은 실패로 두지 않는다(원래 CI 실패를 가리지 않기 위해)."
            head -c 500 /tmp/discord-response.json || true
            echo
          fi
          exit 0
