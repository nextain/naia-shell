name: build installers

on:
  push:
  workflow_dispatch:
    inputs:
      internal_unsigned:
        description: Build an unsigned Windows installer for internal device testing
        required: false
        type: boolean
        default: false

concurrency:
  group: build-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # 배포 전 회귀가 실제로 전부 돌았는지 본다. 기계마다 자기 몫을 돌리고
  # docs/regression-runs/ 에 기록을 남기면, 여기서 그것을 모아 아무도 맡지
  # 않은 스펙과 환경이 없어 건너뛴 것을 찾는다. 기록이 없으면 실패한다 —
  # 돌지 않은 것을 통과로 세지 않는다는 뜻이다.
  #
  # 이 잡이 붉으면 설치본을 만들지 않는다. 설치본이 나가기 전에 회귀가
  # 돌았어야 하기 때문이다.
  regression-gate:
    # 이 워크플로는 모든 푸시에서 돈다. 회귀 기록을 모든 푸시에 요구하면
    # 설치본 생산이 통째로 막히고, 그러면 게이트는 곧 꺼진다. 나가는 것에만
    # 건다 — 태그를 붙이거나 손으로 돌릴 때다.
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && !inputs.internal_unsigned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포 전 회귀 완결성
        run: node scripts/check-regression-complete.mjs --max-age-hours=72

  build:
    # 게이트가 건너뛰어진 경우(일반 푸시)에도 빌드는 돈다. 실패했을 때만 막는다.
    needs: regression-gate
    if: always() && needs.regression-gate.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
            arch: x64
            artifact: win32
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: linux
          - os: macos-15
            platform: darwin
            arch: arm64
            uname_arch: arm64
            artifact: darwin
          - os: macos-15-intel
            platform: darwin
            arch: x64
            uname_arch: x86_64
            artifact: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      NAIA_UNSIGNED: ${{ inputs.internal_unsigned == true || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/tags/')) }}
      MACOS_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      MACOS_NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_API_KEY_P8 != '' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Clone required public runtime sources
        run: |
          git init ../naia-agent
          git -C ../naia-agent remote add origin https://github.com/nextain/naia-agent.git
          git -C ../naia-agent fetch --depth 1 origin fdc6fcb5c34ea453612d968a0259a41aa1ef46ed
          git -C ../naia-agent checkout --detach FETCH_HEAD
          git init ../naia-kb-compiler
          git -C ../naia-kb-compiler remote add origin https://github.com/nextain/naia-kb-compiler.git
          git -C ../naia-kb-compiler fetch --depth 1 origin 24f52c14ea906c250304f39d48866c7a47e1b596
          git -C ../naia-kb-compiler checkout --detach FETCH_HEAD
          git init ../naia-memory
          git -C ../naia-memory remote add origin https://github.com/nextain/naia-memory.git
          git -C ../naia-memory fetch --depth 1 origin e8cbd6f897a999f9a507ac58dbaf93496bc9a7bf
          git -C ../naia-memory checkout --detach FETCH_HEAD
          git init ../voxcpm2-tensorrt
          git -C ../voxcpm2-tensorrt remote add origin https://github.com/nextain/voxcpm2-tensorrt.git
          git -C ../voxcpm2-tensorrt fetch --depth 1 origin 6fdf26e018612db9910fce4161094a10af07013b || true
          git -C ../voxcpm2-tensorrt checkout --detach FETCH_HEAD || true

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.0"

      - name: Install Linux build and smoke dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
             libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
             libasound2-dev libssl-dev libxdo-dev libudev-dev \
             pipewire-alsa xvfb rpm
          sudo apt-get install -y libarchive-tools

      - name: Assert macOS runner architecture
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.uname_arch }}" || {
            echo "::error::Expected macOS ${{ matrix.uname_arch }} runner, got $(uname -m)"
            exit 1
          }

      - run: pnpm install --frozen-lockfile

      - name: Provision verified Windows VoxCPM2 release input
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $url = "https://stnaiapub83b29893.blob.core.windows.net/releases/windows_trt_6g/releases/0.2.2/voxcpm2-runtime-win-trt6g-r2.zip"
          $archive = Join-Path $env:RUNNER_TEMP "voxcpm2-runtime-win-trt6g.zip"
          $runtime = Join-Path $env:RUNNER_TEMP "voxcpm2-runtime"
          curl.exe --location --fail --retry 4 --retry-all-errors --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "VoxCPM2 release input download failed" }
          $item = Get-Item -LiteralPath $archive
          if ($item.Length -ne 2496064260) {
            throw "VoxCPM2 release input size mismatch: $($item.Length)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($hash -ne "0057dcd5d440ac2bd736bc407df7822cb66b628ad031024877dd425e8ed2db33") {
            throw "VoxCPM2 release input SHA-256 mismatch"
          }
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          tar.exe -xf $archive -C $runtime
          if ($LASTEXITCODE -ne 0) { throw "VoxCPM2 release input extraction failed" }
          "NAIA_VOXCPM2_TRT_RUNTIME_DIR=$runtime" >> $env:GITHUB_ENV
          "NAIA_VOXCPM2_TRT_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "NAIA_VOXCPM2_TRT_ARTIFACT_SHA256=5dc02662267f79489896621d39f975af1d081bba49fecf5daac2a1a78e0a4ce5" >> $env:GITHUB_ENV
          if (Test-Path -LiteralPath "packages/shell/scripts/voxcpm2-profile-registry.json") {
            "NAIA_VOXCPM2_PROFILE_REGISTRY=$((Resolve-Path packages/shell/scripts/voxcpm2-profile-registry.json).Path)" >> $env:GITHUB_ENV
          }

      - name: Provision verified Linux VoxCPM2 release input
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          url="https://stnaiapub83b29893.blob.core.windows.net/releases/linux_trt_6g/releases/0.2.3/voxcpm2-runtime-linux-trt6g-r1.zip"
          archive="${RUNNER_TEMP}/voxcpm2-runtime-linux-trt6g-r1.zip"
          runtime="${RUNNER_TEMP}/voxcpm2-runtime"
          archive_bytes=2935215844
          archive_sha256="e6e6a76f970a1311cc868ba38aa95bd7654a60d7f77f6c6274c9433ab62b642d"
          manifest_sha256="43a80742df8828465f7df05f72519c412111bcdd5b727d113280e8112dc51778"
          curl --location --fail --retry 4 --retry-all-errors --output "$archive" "$url"
          test "$(stat -c '%s' "$archive")" = "$archive_bytes"
          printf '%s  %s\n' "$archive_sha256" "$archive" | sha256sum --check --status
          rm -rf "$runtime"
          mkdir -p "$runtime"
          bsdtar -xf "$archive" -C "$runtime"
          test -f "$runtime/artifact-manifest.json"
          test "$(sha256sum "$runtime/artifact-manifest.json" | cut -d' ' -f1)" = "$manifest_sha256"
          {
            echo "NAIA_VOXCPM2_TARGET_PLATFORM=linux"
            echo "NAIA_SYSTEM_TAR=bsdtar"
            echo "NAIA_VOXCPM2_TRT_RUNTIME_DIR=$runtime"
            echo "NAIA_VOXCPM2_TRT_ARCHIVE=$archive"
            echo "NAIA_VOXCPM2_TRT_ARTIFACT_SHA256=$manifest_sha256"
            if [ -f packages/shell/scripts/voxcpm2-profile-registry.json ]; then
              echo "NAIA_VOXCPM2_PROFILE_REGISTRY=$(realpath packages/shell/scripts/voxcpm2-profile-registry.json)"
            fi
          } >> "$GITHUB_ENV"

      - name: Build installer bundle from platform matrix
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.platform == 'win32' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.platform == 'win32' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          NAIA_TAURI_NO_BUNDLE: ${{ (matrix.platform == 'win32' || matrix.platform == 'darwin') && '1' || '0' }}
        run: pnpm -C packages/shell run tauri:build:bundle

      - name: Prepare macOS Developer ID keychain
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/naia-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/naia-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          ORIGINAL_KEYCHAINS_PATH="$RUNNER_TEMP/naia-original-keychains.txt"
          security list-keychains -d user | sed 's/^"//; s/"$//' > "$ORIGINAL_KEYCHAINS_PATH"
          chmod 600 "$ORIGINAL_KEYCHAINS_PATH"
          echo "MACOS_ORIGINAL_KEYCHAINS_PATH=$ORIGINAL_KEYCHAINS_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mapfile -t ORIGINAL_KEYCHAINS < "$ORIGINAL_KEYCHAINS_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"
          # `security import` only accepts a PKCS#12 password through -P; it has no stdin option.
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERTIFICATE_PATH"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare macOS notarization key
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && env.MACOS_NOTARIZATION_CONFIGURED == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/naia-app-store-connect.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Report macOS signing mode
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && env.MACOS_NOTARIZATION_CONFIGURED != 'true'
        run: echo "공증 열쇠 없음, 서명만"

      - name: Bundle macOS application from preserved app build
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ''
          APPLE_API_ISSUER: ''
          APPLE_API_KEY_PATH: ''
        run: pnpm -C packages/shell exec tauri bundle --verbose --bundles app --config src-tauri/tauri.conf.generated.json

      - name: Sign every macOS app Mach-O with hardened runtime
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="packages/shell/src-tauri/target/release/bundle/macos"
          APP_PATHS=("$BUNDLE_DIR"/*.app)
          test "${#APP_PATHS[@]}" -eq 1 && test -d "${APP_PATHS[0]}"
          APP="${APP_PATHS[0]}"
          ENTITLEMENTS="packages/shell/src-tauri/entitlements.plist"
          while IFS= read -r -d '' path; do
            if ! file -b "$path" | grep -q 'Mach-O'; then continue; fi
            if [[ "$path" == "$APP/Contents/Resources/node" ]]; then
              codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" --sign "$APPLE_SIGNING_IDENTITY" "$path"
            else
              codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$path"
            fi
          # Bundled paths contain no newlines; reverse lexical order signs deeper paths first.
          done < <(find "$APP/Contents" -type f -print | LC_ALL=C sort -r)
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize and staple macOS app
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && env.MACOS_NOTARIZATION_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATHS=("packages/shell/src-tauri/target/release/bundle/macos"/*.app)
          test "${#APP_PATHS[@]}" -eq 1 && test -d "${APP_PATHS[0]}"
          ZIP="$RUNNER_TEMP/Naia-app-notarization.zip"
          ditto -c -k --keepParent "${APP_PATHS[0]}" "$ZIP"
          NOTARY_RESULT="$RUNNER_TEMP/Naia-app-notary-result.json"
          NOTARY_LOG="$RUNNER_TEMP/Naia-app-notary-log.txt"
          NOTARY_ERROR="$RUNNER_TEMP/Naia-app-notary-error.txt"
          NOTARY_EXIT=0
          xcrun notarytool submit "$ZIP" --wait --output-format json \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" > "$NOTARY_RESULT" 2> "$NOTARY_ERROR" || NOTARY_EXIT=$?
          NOTARY_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$NOTARY_RESULT" 2>/dev/null || true)"
          if [ "$NOTARY_EXIT" -ne 0 ] || [ "$NOTARY_STATUS" != "Accepted" ]; then
            NOTARY_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$NOTARY_RESULT" 2>/dev/null || true)"
            if [ -n "$NOTARY_ID" ]; then
              xcrun notarytool log "$NOTARY_ID" --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" > "$NOTARY_LOG" 2>&1 || true
              cat "$NOTARY_LOG"
            fi
            echo "App notarization failed (status: ${NOTARY_STATUS:-unavailable})."
            exit 1
          fi
          xcrun stapler staple "${APP_PATHS[0]}"
          spctl -a -vv -t exec "${APP_PATHS[0]}"
          xcrun stapler validate "${APP_PATHS[0]}"
          rm -f "$ZIP"

      - name: Build macOS DMG
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ''
          APPLE_API_ISSUER: ''
          # Tauri must not sign/notarize the DMG implicitly; explicit steps below own that lifecycle.
          APPLE_CERTIFICATE: ''
          APPLE_CERTIFICATE_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ''
        run: |
          set -euo pipefail
          set -o pipefail
          unset APPLE_API_KEY_PATH
          LOG_FILE="$RUNNER_TEMP/tauri-macos-dmg.log"
          if ! pnpm -C packages/shell exec tauri bundle --bundles dmg --verbose \
            --config src-tauri/tauri.conf.generated.json 2>&1 | tee "$LOG_FILE"; then
            if grep -q "bundle_dmg" "$LOG_FILE"; then
              echo "::warning::bundle_dmg failed on first attempt; detaching leftover hdiutil devices and retrying once"
              BUNDLE_MACOS_LOGICAL="$PWD/packages/shell/src-tauri/target/release/bundle/macos"
              BUNDLE_MACOS_PHYS="$(cd packages/shell/src-tauri/target/release/bundle/macos 2>/dev/null && pwd -P || printf '%s\n' "$BUNDLE_MACOS_LOGICAL")"
              DMG_DIR_LOGICAL="$PWD/packages/shell/src-tauri/target/release/bundle/dmg"
              DMG_DIR_PHYS="$(cd packages/shell/src-tauri/target/release/bundle/dmg 2>/dev/null && pwd -P || printf '%s\n' "$DMG_DIR_LOGICAL")"
              hdiutil info | awk \
                -v macos_dir="$BUNDLE_MACOS_PHYS" \
                -v macos_dir_logical="$BUNDLE_MACOS_LOGICAL" \
                -v dmg_dir="$DMG_DIR_PHYS" \
                -v dmg_dir_logical="$DMG_DIR_LOGICAL" '
                /^====/ { dmg=0 }
                /^image-path[[:space:]]*:/ {
                  path=$0
                  sub(/^image-path[[:space:]]*:[[:space:]]*/, "", path)
                  dir=path
                  sub(/\/[^\/]+$/, "", dir)
                  base=path
                  sub(/^.*\//, "", base)
                  in_macos=(dir == macos_dir || dir == macos_dir_logical)
                  in_dmg=(dir == dmg_dir || dir == dmg_dir_logical)
                  is_rw_dmg=(base ~ /^rw\..*\.dmg$/)
                  dmg=((in_macos && is_rw_dmg) || in_dmg)
                }
                /^\/dev\/disk/ && dmg { print $1 }
              ' | sort -u | while read -r dev; do
                hdiutil detach -force "$dev" || true
              done
              rm -f \
                packages/shell/src-tauri/target/release/bundle/macos/rw.*.dmg \
                packages/shell/src-tauri/target/release/bundle/macos/Naia_*.dmg \
                packages/shell/src-tauri/target/release/bundle/dmg/rw.*.dmg \
                packages/shell/src-tauri/target/release/bundle/dmg/Naia_*.dmg
              pnpm -C packages/shell exec tauri bundle --bundles dmg --verbose \
                --config src-tauri/tauri.conf.generated.json
            else
              exit 1
            fi
          fi

      - name: Sign macOS DMG with Developer ID
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          DMG_PATHS=("packages/shell/src-tauri/target/release/bundle/dmg"/*.dmg)
          test "${#DMG_PATHS[@]}" -eq 1 && test -f "${DMG_PATHS[0]}"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "${DMG_PATHS[0]}"

      - name: Notarize and staple macOS DMG
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && env.MACOS_NOTARIZATION_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATHS=("packages/shell/src-tauri/target/release/bundle/dmg"/*.dmg)
          test "${#DMG_PATHS[@]}" -eq 1 && test -f "${DMG_PATHS[0]}"
          codesign --verify --strict --verbose=2 "${DMG_PATHS[0]}"
          NOTARY_RESULT="$RUNNER_TEMP/Naia-dmg-notary-result.json"
          NOTARY_LOG="$RUNNER_TEMP/Naia-dmg-notary-log.txt"
          NOTARY_ERROR="$RUNNER_TEMP/Naia-dmg-notary-error.txt"
          NOTARY_EXIT=0
          xcrun notarytool submit "${DMG_PATHS[0]}" --wait --output-format json \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" > "$NOTARY_RESULT" 2> "$NOTARY_ERROR" || NOTARY_EXIT=$?
          NOTARY_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$NOTARY_RESULT" 2>/dev/null || true)"
          if [ "$NOTARY_EXIT" -ne 0 ] || [ "$NOTARY_STATUS" != "Accepted" ]; then
            NOTARY_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$NOTARY_RESULT" 2>/dev/null || true)"
            if [ -n "$NOTARY_ID" ]; then
              xcrun notarytool log "$NOTARY_ID" --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" > "$NOTARY_LOG" 2>&1 || true
              cat "$NOTARY_LOG"
            fi
            echo "DMG notarization failed (status: ${NOTARY_STATUS:-unavailable})."
            exit 1
          fi
          xcrun stapler staple "${DMG_PATHS[0]}"
          xcrun stapler validate "${DMG_PATHS[0]}"

      - name: Verify macOS code signature
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="packages/shell/src-tauri/target/release/bundle/macos"
          APP_PATHS=("$BUNDLE_DIR"/*.app)
          test "${#APP_PATHS[@]}" -eq 1 && test -d "${APP_PATHS[0]}"
          APP="${APP_PATHS[0]}"
          codesign --verify --deep --strict --verbose=2 "$APP"
          while IFS= read -r -d '' path; do
            if file -b "$path" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$path"
            fi
          done < <(find "$APP/Contents" -type f -print0)

      - name: Verify macOS notarization and stapling
        if: matrix.platform == 'darwin' && env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && env.MACOS_NOTARIZATION_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATHS=("packages/shell/src-tauri/target/release/bundle/macos"/*.app)
          test "${#APP_PATHS[@]}" -eq 1 && test -d "${APP_PATHS[0]}"
          spctl -a -vv -t exec "${APP_PATHS[0]}"
          xcrun stapler validate "${APP_PATHS[0]}"
          DMG_PATHS=("packages/shell/src-tauri/target/release/bundle/dmg"/*.dmg)
          test "${#DMG_PATHS[@]}" -eq 1 && test -f "${DMG_PATHS[0]}"
          xcrun stapler validate "${DMG_PATHS[0]}"

      - name: Clean macOS signing credentials
        if: always() && matrix.platform == 'darwin'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/naia-app-store-connect.p8" "$RUNNER_TEMP/naia-signing.p12" \
            "$RUNNER_TEMP/Naia-app-notarization.zip" "$RUNNER_TEMP/Naia-app-notary-result.json" \
            "$RUNNER_TEMP/Naia-app-notary-log.txt" "$RUNNER_TEMP/Naia-app-notary-error.txt" \
            "$RUNNER_TEMP/Naia-dmg-notary-result.json" "$RUNNER_TEMP/Naia-dmg-notary-log.txt" \
            "$RUNNER_TEMP/Naia-dmg-notary-error.txt"
          if [ -n "${MACOS_ORIGINAL_KEYCHAINS_PATH:-}" ] && [ -f "$MACOS_ORIGINAL_KEYCHAINS_PATH" ]; then
            mapfile -t ORIGINAL_KEYCHAINS < "$MACOS_ORIGINAL_KEYCHAINS_PATH"
            if [ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]; then security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}"; fi
            rm -f "$MACOS_ORIGINAL_KEYCHAINS_PATH"
          fi
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi

      - name: Preserve macOS outputs after bundle attempt
        if: always() && matrix.platform == 'darwin'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naia-shell-macos-bundle-input-${{ matrix.artifact }}-${{ github.run_id }}
          path: |
            packages/shell/src-tauri/target/release/naia-shell
            packages/shell/src-tauri/target/release/bundle/macos
          if-no-files-found: warn
          retention-days: 7

      - name: Authenticate to Azure for Artifact Signing
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}

      - name: Publicly sign Windows application payload
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://krc.codesigning.azure.net/
          signing-account-name: nextain-public-signing
          certificate-profile-name: naia-public-trust
          files: ${{ github.workspace }}\packages\shell\src-tauri\target\release\naia-shell.exe
          files-folder: ${{ github.workspace }}\packages\shell\src-tauri\resources
          files-folder-filter: exe,dll,pyd,node
          files-folder-recurse: true
          append-signature: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          timeout: 1800
          batch-size: 30000

      - name: Verify signed Windows application payload
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        shell: pwsh
        run: |
          $app = Get-Item "packages/shell/src-tauri/target/release/naia-shell.exe"
          $payloads = @(
            $app
            Get-ChildItem "packages/shell/src-tauri/resources" -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".dll", ".pyd", ".node") }
          )
          if ($payloads.Count -lt 2) {
            throw "Expected the app executable and bundled Windows PE payloads"
          }

          foreach ($payload in $payloads) {
            $authenticode = Get-AuthenticodeSignature -LiteralPath $payload.FullName
            if ($authenticode.Status -ne "Valid") {
              throw "Invalid bundled PE signature: $($payload.FullName) = $($authenticode.Status)"
            }
          }

          $appSignature = Get-AuthenticodeSignature -LiteralPath $app.FullName
          if ($appSignature.SignerCertificate.Subject -notmatch "O=Nextain INC") {
            throw "Unexpected app signer subject: $($appSignature.SignerCertificate.Subject)"
          }

      - name: Bundle signed Windows application payload
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NAIA_WINDOWS_SIGN: "1"
        run: >-
          pnpm -C packages/shell exec tauri bundle --verbose
          --config src-tauri/tauri.conf.generated.json

      - name: Bundle Windows application payload for internal testing
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm -C packages/shell exec tauri bundle --verbose
          --config src-tauri/tauri.conf.generated.json

      - name: Verify application executable signature inside bundled MSI
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        shell: pwsh
        run: |
          # Tauri bundler restores target/release/naia-shell.exe from a pre-bundle copy after bundling,
          # so verifying target/release/naia-shell.exe directly only checks the pre-bundle binary.
          # To verify that signCommand actually signed the patched payload binary, we extract the MSI and
          # inspect naia-shell.exe inside it. This step runs before 'Publicly sign Windows installers'
          # to fail fast if the packaged payload binary is invalid before spending time signing installer packages
          # (administrative extraction via msiexec /a does not require the MSI to have an outer signature).
          $msi = @(Get-ChildItem packages/shell/src-tauri/target/release/bundle/msi/*.msi)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msi.Count)"
          }
          $targetDir = Join-Path $env:RUNNER_TEMP "naia-msi-sig-verify"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          try {
            $process = Start-Process -FilePath "msiexec.exe" `
              -ArgumentList "/a `"$($msi[0].FullName)`" /qn TARGETDIR=`"$targetDir`"" `
              -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "MSI administrative extraction failed with exit code $($process.ExitCode)"
            }
            $shellExe = Get-ChildItem -LiteralPath $targetDir -Recurse -File -Filter "naia-shell.exe" |
              Select-Object -First 1
            if (-not $shellExe) {
              throw "naia-shell.exe not found inside extracted MSI: $targetDir"
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $shellExe.FullName
            if ($sig.Status -ne "Valid") {
              throw "naia-shell.exe inside MSI signature is not valid: $($sig.Status)"
            }
            if ($sig.SignerCertificate.Subject -notmatch "O=Nextain INC") {
              throw "naia-shell.exe inside MSI signer subject mismatch: $($sig.SignerCertificate.Subject)"
            }
          } finally {
            Remove-Item -LiteralPath $targetDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Publicly sign Windows installers
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://krc.codesigning.azure.net/
          signing-account-name: nextain-public-signing
          certificate-profile-name: naia-public-trust
          files-folder: ${{ github.workspace }}\packages\shell\src-tauri\target\release\bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode and refresh updater signatures
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundleDir = Resolve-Path "packages/shell/src-tauri/target/release/bundle"
          $installers = @(
            Get-ChildItem "$bundleDir/nsis/*-setup.exe"
            Get-ChildItem "$bundleDir/msi/*.msi"
          )
          if ($installers.Count -ne 2) {
            throw "Expected one NSIS and one MSI installer, found $($installers.Count)"
          }

          foreach ($installer in $installers) {
            $authenticode = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($authenticode.Status -ne "Valid") {
              throw "Invalid Authenticode signature: $($installer.Name) = $($authenticode.Status)"
            }
            if ($authenticode.SignerCertificate.Subject -notmatch "O=Nextain INC") {
              throw "Unexpected signer subject: $($authenticode.SignerCertificate.Subject)"
            }

            $updaterSignature = "$($installer.FullName).sig"
            Remove-Item -LiteralPath $updaterSignature -Force -ErrorAction SilentlyContinue
            pnpm -C packages/shell exec tauri signer sign $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Updater signing failed: $($installer.Name)"
            }
            if (-not (Test-Path -LiteralPath $updaterSignature -PathType Leaf)) {
              throw "Updater signature was not created: $updaterSignature"
            }
          }

      - name: Archive complete macOS app bundle
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          BUNDLE_DIR="packages/shell/src-tauri/target/release/bundle"
          APP_PATHS=()
          while IFS= read -r path; do APP_PATHS+=("$path"); done < <(
            find "$BUNDLE_DIR/macos" -maxdepth 1 -type d -name '*.app' -print
          )
          test "${#APP_PATHS[@]}" -eq 1 || {
            echo "::error::Expected exactly one macOS app bundle, found ${#APP_PATHS[@]}"
            exit 1
          }
          APP_PATH="${APP_PATHS[0]}"
          APP_NAME="$(basename "$APP_PATH")"
          tar -C "$BUNDLE_DIR/macos" -czf "$BUNDLE_DIR/macos/${APP_NAME}.tar.gz" "$APP_NAME"

      - name: Archive executable Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          BUNDLE_DIR="packages/shell/src-tauri/target/release/bundle"
          APPIMAGE_PATHS=()
          while IFS= read -r path; do APPIMAGE_PATHS+=("$path"); done < <(
            find "$BUNDLE_DIR/appimage" -maxdepth 1 -type f -name '*.AppImage' -print
          )
          test "${#APPIMAGE_PATHS[@]}" -eq 1 || {
            echo "::error::Expected exactly one Linux AppImage, found ${#APPIMAGE_PATHS[@]}"
            exit 1
          }
          APPIMAGE_PATH="${APPIMAGE_PATHS[0]}"
          test -x "$APPIMAGE_PATH" || {
            echo "::error::Linux AppImage is not executable: $APPIMAGE_PATH"
            exit 1
          }
          APPIMAGE_NAME="$(basename "$APPIMAGE_PATH")"
          tar -C "$BUNDLE_DIR/appimage" -czf "$BUNDLE_DIR/appimage/${APPIMAGE_NAME}.tar.gz" "$APPIMAGE_NAME"

      - name: Verify installer artifacts
        run: node packages/shell/scripts/verify-artifacts.mjs

      - name: Validate MSI structure
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem packages/shell/src-tauri/target/release/bundle/msi/*.msi)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msi.Count)"
          }
          $target = Join-Path $env:RUNNER_TEMP "naia-msi-admin"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $process = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/a `"$($msi[0].FullName)`" /qn TARGETDIR=`"$target`"" `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "MSI administrative extraction failed with exit code $($process.ExitCode)"
          }
          $shellBinary = @(Get-ChildItem -LiteralPath $target -Recurse -File -Filter "naia-shell.exe")
          $nodeBinary = @(Get-ChildItem -LiteralPath $target -Recurse -File -Filter "node.exe")
          if ($shellBinary.Count -ne 1 -or $nodeBinary.Count -ne 1) {
            throw "MSI payload incomplete: naia-shell.exe=$($shellBinary.Count), node.exe=$($nodeBinary.Count)"
          }

      - name: Validate Linux package structures
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          BUNDLE_DIR="packages/shell/src-tauri/target/release/bundle"
          RPM="$(find "$BUNDLE_DIR/rpm" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          APPIMAGE_TAR="$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -type f -name '*.AppImage.tar.gz' -print -quit)"
          test -n "$RPM" && rpm -K --nosignature "$RPM"
          test -n "$APPIMAGE_TAR" && tar -tzf "$APPIMAGE_TAR" >/dev/null
          EXTRACTED="$(mktemp -d)"
          trap 'rm -rf "$EXTRACTED"' EXIT
          tar -xzf "$APPIMAGE_TAR" -C "$EXTRACTED"
          EXTRACTED_APPIMAGE="$(find "$EXTRACTED" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$EXTRACTED_APPIMAGE" && test -x "$EXTRACTED_APPIMAGE"
          (
            cd "$EXTRACTED"
            "$EXTRACTED_APPIMAGE" --appimage-extract >/dev/null
          )
          test -x "$EXTRACTED/squashfs-root/AppRun"
          find "$EXTRACTED/squashfs-root" -type f -name 'naia-shell' -perm -111 -print -quit | grep -q .
          find "$EXTRACTED/squashfs-root" -type f -name 'node' -perm -111 -print -quit | grep -q .

      - name: Validate macOS package structures
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          BUNDLE_DIR="packages/shell/src-tauri/target/release/bundle"
          DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          APP_TAR="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$DMG" && hdiutil verify "$DMG"
          test -n "$APP_TAR" && tar -tzf "$APP_TAR" >/dev/null
          EXTRACTED="$(mktemp -d)"
          MOUNT="$(mktemp -d)"
          MOUNTED=0
          cleanup() {
            if [ "$MOUNTED" -eq 1 ]; then hdiutil detach "$MOUNT" >/dev/null; fi
            rm -rf "$EXTRACTED" "$MOUNT"
          }
          trap cleanup EXIT
          validate_app() {
            local ROOT="$1"
            local APPS=("$ROOT"/*.app)
            test "${#APPS[@]}" -eq 1 && test -d "${APPS[0]}"
            local APP="${APPS[0]}"
            local INFO="$APP/Contents/Info.plist"
            plutil -lint "$INFO"
            local EXECUTABLE
            EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
            test -n "$EXECUTABLE" && test -x "$APP/Contents/MacOS/$EXECUTABLE"
            test -x "$APP/Contents/Resources/node"
          }
          tar -xzf "$APP_TAR" -C "$EXTRACTED"
          validate_app "$EXTRACTED"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG" >/dev/null
          MOUNTED=1
          validate_app "$MOUNT"

      - name: Install NSIS and prove bundled Node at runtime
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            packages/shell/src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found"
          }
          $process = Start-Process -FilePath $installer.FullName `
            -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS silent install failed with exit code $($process.ExitCode)"
          }
          $resourceDir = Join-Path $env:LOCALAPPDATA "Naia"
          $binary = Join-Path $resourceDir "naia-shell.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Installed naia-shell.exe not found: $binary"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $resourceDir "node.exe") -PathType Leaf)) {
            throw "Installed bundled node.exe not found: $resourceDir"
          }
          node packages/shell/scripts/verify-installed-smoke.mjs `
            --binary $binary --resource-dir $resourceDir --timeout-ms 120000

      - name: Prepare and verify Steam portable depot
        id: steam
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        shell: pwsh
        run: |
          $resourceDir = Join-Path $env:LOCALAPPDATA "Naia"
          $uninstaller = Join-Path $resourceDir "uninstall.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "NSIS uninstaller not found before Steam depot preparation"
          }
          $bundleDir = Resolve-Path "packages/shell/src-tauri/target/release/bundle"
          $steamDepot = node packages/shell/scripts/prepare-steam-depot.mjs `
            --source $resourceDir --bundle-dir $bundleDir `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) {
            throw "Steam depot preparation failed with exit code $LASTEXITCODE"
          }
          $steamDepot = $steamDepot.Trim()
          $contract = (Get-Content packages/shell/src-tauri/platform-matrix.json -Raw |
            ConvertFrom-Json).os.win32.steamDepot
          $binary = Join-Path $steamDepot $contract.entrypoint
          $depotSig = Get-AuthenticodeSignature -LiteralPath $binary
          if ($depotSig.Status -ne "Valid") {
            throw "Steam depot naia-shell.exe signature is not valid: $($depotSig.Status)"
          }
          if ($depotSig.SignerCertificate.Subject -notmatch "O=Nextain INC") {
            throw "Steam depot naia-shell.exe signer subject mismatch: $($depotSig.SignerCertificate.Subject)"
          }

          # #727: the Steam build tells itself apart by this marker file, so it
          # must exist in the depot and be covered by the depot hash list.
          $markerFile = $contract.distributionMarker.file
          $markerPath = Join-Path $steamDepot $markerFile
          if (-not (Test-Path -LiteralPath $markerPath -PathType Leaf)) {
            throw "Steam depot distribution marker is missing: $markerFile"
          }
          if ((Get-Content -LiteralPath $markerPath -Raw).Trim() -ne $contract.distributionMarker.content) {
            throw "Steam depot distribution marker content mismatch"
          }
          $manifestPath = Join-Path $steamDepot $contract.manifest
          $markerHash = (Get-FileHash -LiteralPath $markerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $markerLine = "$markerHash  $markerFile"
          if (-not ((Get-Content -LiteralPath $manifestPath) -contains $markerLine)) {
            throw "Steam depot hash list does not cover the distribution marker"
          }

          $uninstall = Start-Process -FilePath $uninstaller `
            -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS silent uninstall failed with exit code $($uninstall.ExitCode)"
          }
          for ($attempt = 0; $attempt -lt 20 -and
              (Test-Path -LiteralPath $resourceDir); $attempt++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $resourceDir) {
            throw "NSIS install location remains after silent uninstall"
          }
          $uninstallKey = Get-ChildItem `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" `
            -ErrorAction SilentlyContinue |
            Get-ItemProperty |
            Where-Object DisplayName -eq "Naia"
          if ($uninstallKey) {
            throw "NSIS uninstall registry entry remains after silent uninstall"
          }

          node packages/shell/scripts/verify-installed-smoke.mjs `
            --binary $binary --resource-dir $steamDepot --timeout-ms 120000
          if ($LASTEXITCODE -ne 0) {
            throw "Steam portable smoke failed with exit code $LASTEXITCODE"
          }

      - name: Install deb and prove bundled Node at runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          DEB="$(find packages/shell/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$DEB"
          DEB="$(realpath "$DEB")"
          test -f "$DEB"
          sudo apt-get install -y "$DEB"
          BIN="$(command -v naia-shell)"
          PRODUCT_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/shell/src-tauri/tauri.conf.json', 'utf8')).productName")"
          test -n "$PRODUCT_NAME"
          RESOURCE_DIR="/usr/lib/$PRODUCT_NAME"
          test -x "$BIN"
          test -x "$RESOURCE_DIR/node"

          WRAPPED_CLAUDE="$RESOURCE_DIR/agent/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude"
          WRAPPED_PAYLOAD="$WRAPPED_CLAUDE.payload.gz"
          WRAPPER_CACHE="$RUNNER_TEMP/naia-wrapper-cache"
          test -x "$WRAPPED_CLAUDE"

          # Two simultaneous first launches must both succeed and converge on one valid cache entry.
          XDG_CACHE_HOME="$WRAPPER_CACHE" "$WRAPPED_CLAUDE" --version &
          WRAPPER_PID_1=$!
          XDG_CACHE_HOME="$WRAPPER_CACHE" "$WRAPPED_CLAUDE" --version &
          WRAPPER_PID_2=$!
          wait "$WRAPPER_PID_1"
          wait "$WRAPPER_PID_2"
          RESTORED_CLAUDE="$(find "$WRAPPER_CACHE/naia/embedded-cli" -name 'claude-*' -type f -perm -u+x -print -quit)"
          test -n "$RESTORED_CLAUDE" || {
            echo "::error::wrapped Claude executable was not restored into the user cache"
            exit 1
          }

          # An executable-but-corrupt cache entry must be detected and repaired.
          printf 'corrupt cache' > "$RESTORED_CLAUDE"
          chmod 700 "$RESTORED_CLAUDE"
          XDG_CACHE_HOME="$WRAPPER_CACHE" "$WRAPPED_CLAUDE" --version

          # A valid gzip containing the wrong executable must fail before publication.
          cp "$WRAPPED_PAYLOAD" "$RUNNER_TEMP/claude.payload.original.gz"
          node -e 'const fs=require("node:fs"),z=require("node:zlib");fs.writeFileSync(process.argv[1],z.gzipSync(Buffer.from("#!/bin/sh\nexit 0\n")))' "$RUNNER_TEMP/claude.payload.tampered.gz"
          sudo cp "$RUNNER_TEMP/claude.payload.tampered.gz" "$WRAPPED_PAYLOAD"
          rm -f "$RESTORED_CLAUDE"
          set +e
          XDG_CACHE_HOME="$WRAPPER_CACHE" "$WRAPPED_CLAUDE" --version
          TAMPER_STATUS=$?
          set -e
          sudo cp "$RUNNER_TEMP/claude.payload.original.gz" "$WRAPPED_PAYLOAD"
          test "$TAMPER_STATUS" -ne 0 || {
            echo "::error::tampered wrapped payload unexpectedly executed"
            exit 1
          }
          echo "wrapped payload tamper probe: expected RED confirmed"

          sudo mv "$RESOURCE_DIR/node" "$RESOURCE_DIR/node.mutation-disabled"
          set +e
          xvfb-run -a node packages/shell/scripts/verify-installed-smoke.mjs \
            --binary "$BIN" --resource-dir "$RESOURCE_DIR" --timeout-ms 120000
          MUTATION_STATUS=$?
          set -e
          sudo mv "$RESOURCE_DIR/node.mutation-disabled" "$RESOURCE_DIR/node"
          test "$MUTATION_STATUS" -ne 0 || {
            echo "::error::mutation probe unexpectedly passed without bundled Node"
            exit 1
          }
          echo "mutation probe: expected RED confirmed"

          xvfb-run -a node packages/shell/scripts/verify-installed-smoke.mjs \
            --binary "$BIN" --resource-dir "$RESOURCE_DIR" --timeout-ms 120000

      - name: Upload installer outputs
        if: ${{ env.NAIA_UNSIGNED != 'true' || matrix.platform != 'win32' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naia-shell-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            packages/shell/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/shell/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            packages/shell/src-tauri/target/release/bundle/msi/*.msi
            packages/shell/src-tauri/target/release/bundle/msi/*.msi.sig
            packages/shell/src-tauri/target/release/bundle/deb/*.deb
            packages/shell/src-tauri/target/release/bundle/rpm/*.rpm
            packages/shell/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            packages/shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
            packages/shell/src-tauri/target/release/bundle/dmg/*.dmg
            packages/shell/src-tauri/target/release/bundle/artifacts.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned internal Windows installers
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naia-shell-win32-UNSIGNED-INTERNAL-${{ github.sha }}
          path: |
            packages/shell/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/shell/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 3

      - name: Upload Steam portable depot
        if: matrix.platform == 'win32' && env.NAIA_UNSIGNED != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naia-shell-steam-win32-${{ github.sha }}
          path: ${{ steps.steam.outputs.depot }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  macos-universal:
    needs: build
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      NAIA_UNSIGNED: ${{ inputs.internal_unsigned == true || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/tags/')) }}
      MACOS_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      MACOS_NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: naia-shell-darwin-x64-${{ github.sha }}
          path: universal-input/x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: naia-shell-darwin-${{ github.sha }}
          path: universal-input/arm64
      - name: Extract architecture app bundles
        shell: bash
        run: |
          mkdir -p universal-input/x64-app universal-input/arm64-app universal-output
          tar -xzf universal-input/x64/macos/*.app.tar.gz -C universal-input/x64-app
          tar -xzf universal-input/arm64/macos/*.app.tar.gz -C universal-input/arm64-app
      - name: Assemble and verify every Universal Mach-O
        run: >-
          node packages/shell/scripts/assemble-macos-universal.mjs
          --x64-app universal-input/x64-app/Naia.app
          --arm64-app universal-input/arm64-app/Naia.app
          --output-app universal-output/Naia.app

      - name: Prepare Universal macOS Developer ID keychain
        if: env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/naia-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/naia-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          ORIGINAL_KEYCHAINS_PATH="$RUNNER_TEMP/naia-original-keychains.txt"
          security list-keychains -d user | sed 's/^"//; s/"$//' > "$ORIGINAL_KEYCHAINS_PATH"
          chmod 600 "$ORIGINAL_KEYCHAINS_PATH"
          echo "MACOS_ORIGINAL_KEYCHAINS_PATH=$ORIGINAL_KEYCHAINS_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mapfile -t ORIGINAL_KEYCHAINS < "$ORIGINAL_KEYCHAINS_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"
          # `security import` only accepts a PKCS#12 password through -P; it has no stdin option.
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERTIFICATE_PATH"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare Universal macOS notarization key
        if: env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && env.MACOS_NOTARIZATION_CONFIGURED == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/naia-app-store-connect.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Report Universal macOS signing mode
        if: env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && env.MACOS_NOTARIZATION_CONFIGURED != 'true'
        run: echo "공증 열쇠 없음, 서명만"

      - name: Sign every Universal Mach-O with hardened runtime
        if: env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="universal-output/Naia.app"
          ENTITLEMENTS="packages/shell/src-tauri/entitlements.plist"
          while IFS= read -r -d '' path; do
            if ! file -b "$path" | grep -q 'Mach-O'; then continue; fi
            if [[ "$path" == "$APP/Contents/Resources/node" ]]; then
              codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" --sign "$APPLE_SIGNING_IDENTITY" "$path"
            else
              codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$path"
            fi
          # Bundled paths contain no newlines; reverse lexical order signs deeper paths first.
          done < <(find "$APP/Contents" -type f -print | LC_ALL=C sort -r)
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize and staple Universal app
        if: env.NAIA_UNSIGNED != 'true' && env.MACOS_SIGNING_CONFIGURED == 'true' && env.MACOS_NOTARIZATION_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP="universal-output/Naia.app"
          ZIP="$RUNNER_TEMP/Naia-universal-notarization.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          NOTARY_RESULT="$RUNNER_TEMP/Naia-universal-notary-result.json"
          NOTARY_LOG="$RUNNER_TEMP/Naia-universal-notary-log.txt"
          NOTARY_ERROR="$RUNNER_TEMP/Naia-universal-notary-error.txt"
          NOTARY_EXIT=0
          xcrun notarytool submit "$ZIP" --wait --output-format json \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" > "$NOTARY_RESULT" 2> "$NOTARY_ERROR" || NOTARY_EXIT=$?
          NOTARY_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$NOTARY_RESULT" 2>/dev/null || true)"
          if [ "$NOTARY_EXIT" -ne 0 ] || [ "$NOTARY_STATUS" != "Accepted" ]; then
            NOTARY_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$NOTARY_RESULT" 2>/dev/null || true)"
            if [ -n "$NOTARY_ID" ]; then
              xcrun notarytool log "$NOTARY_ID" --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" > "$NOTARY_LOG" 2>&1 || true
              cat "$NOTARY_LOG"
            fi
            echo "Universal app notarization failed (status: ${NOTARY_STATUS:-unavailable})."
            exit 1
          fi
          xcrun stapler staple "$APP"
          spctl -a -vv -t exec "$APP"
          xcrun stapler validate "$APP"
          rm -f "$ZIP"

      - name: Clean Universal macOS signing credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/naia-app-store-connect.p8" "$RUNNER_TEMP/naia-signing.p12" \
            "$RUNNER_TEMP/Naia-universal-notarization.zip" "$RUNNER_TEMP/Naia-universal-notary-result.json" \
            "$RUNNER_TEMP/Naia-universal-notary-log.txt" "$RUNNER_TEMP/Naia-universal-notary-error.txt"
          if [ -n "${MACOS_ORIGINAL_KEYCHAINS_PATH:-}" ] && [ -f "$MACOS_ORIGINAL_KEYCHAINS_PATH" ]; then
            mapfile -t ORIGINAL_KEYCHAINS < "$MACOS_ORIGINAL_KEYCHAINS_PATH"
            if [ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]; then security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}"; fi
            rm -f "$MACOS_ORIGINAL_KEYCHAINS_PATH"
          fi
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
      - name: Archive Universal app bundle
        shell: bash
        run: tar -C universal-output -czf universal-output/Naia_universal.app.tar.gz Naia.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naia-shell-darwin-universal-${{ github.sha }}
          path: universal-output/Naia_universal.app.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos-universal-smoke:
    needs: macos-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            uname_arch: arm64
          - os: macos-15-intel
            arch: x64
            uname_arch: x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: naia-shell-darwin-universal-${{ github.sha }}
          path: universal-smoke
      - name: Extract and launch Universal app
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
          tar -xzf universal-smoke/Naia_universal.app.tar.gz -C universal-smoke
          APP="$PWD/universal-smoke/Naia.app"
          node packages/shell/scripts/verify-installed-smoke.mjs \
            --binary "$APP/Contents/MacOS/naia-shell" \
            --resource-dir "$APP/Contents/Resources" \
            --timeout-ms 120000
