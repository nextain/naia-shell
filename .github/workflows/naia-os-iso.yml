name: Naia OS ISO

# Lives here rather than in nextain/naia-os because the R2 publishing
# credentials are repository secrets of this repository, alongside the cosign
# key the image workflow needs. The ISO content — the titanoboa hook, the
# installer assets, the version — comes from the image layer repository.

on:
  workflow_run:
    workflows: ["Naia OS image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      variant:
        description: "Which image to wrap in an ISO"
        required: false
        default: nvidia
        type: choice
        options: [nvidia, amd, amd-server]
      image_ref:
        description: "nextain/naia-os ref to take the ISO hook and version from. amd-server is on build/bc250-install-20260908 until merged to main."
        required: false
        default: "main"

permissions:
  contents: write
  packages: read

env:
  IMAGE_REGISTRY: ghcr.io/nextain
  IMAGE_LAYER_REPO: nextain/naia-os
  R2_PUBLIC: https://pub-affd0538517845d98ce44a5aec11dd98.r2.dev
  R2_BUCKET: s3://naia-releases
  # The two variants must not overwrite each other's ISO.
  ISO_KEY: naia-os-live-amd64.iso

jobs:
  build-iso:
    name: Generate ISO
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Check out the image layer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IMAGE_LAYER_REPO }}
          ref: ${{ inputs.image_ref || 'main' }}

      - name: Resolve the variant
        id: variant
        run: |
          set -euo pipefail
          case "${{ inputs.variant || 'nvidia' }}" in
            nvidia) echo "image=naia-os"            >> "$GITHUB_OUTPUT" ;;
            amd)    echo "image=naia-os-amd"        >> "$GITHUB_OUTPUT" ;;
            amd-server) echo "image=naia-os-amd-server" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown variant '${{ inputs.variant }}'"; exit 1 ;;
          esac

      - name: Read the Naia OS version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < config/files/usr/share/naia/naia-os-version)"
          test -n "$VERSION" || { echo "::error::naia-os-version is empty"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      # Resolve `latest` to a digest once, here, and build against that digest
      # for the rest of the job. Passing the tag to titanoboa would let a
      # scheduled or manual image build move `latest` between this job starting
      # and titanoboa pulling, so the ISO would ship an image that never passed
      # a smoke test while the workflow history claims otherwise.
      - name: Pin the image digest
        id: image
        run: |
          set -euo pipefail
          REF="${IMAGE_REGISTRY}/${{ steps.variant.outputs.image }}"
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REF}:latest")"
          test -n "$DIGEST" || { echo "::error::could not resolve ${REF}:latest"; exit 1; }
          echo "ref=${REF}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Building an ISO around ${REF}@${DIGEST}"

      # The post-rootfs hook reads its branding assets from inside the image and
      # assumes the layered shell is there. Prove both against the pinned digest
      # before spending ~40 minutes wrapping an ISO around it.
      - name: Verify the pinned image
        run: |
          set -euo pipefail
          podman run --rm --entrypoint /bin/bash \
            "${{ steps.image.outputs.ref }}" \
            /usr/libexec/naia-verify-image

      - name: Build ISO
        id: build
        uses: nextain/titanoboa@main
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          hook-post-rootfs: ${{ github.workspace }}/installer/hook-post-rootfs.sh
          flatpaks-list: ${{ github.workspace }}/installer/flatpaks
          iso-dest: ${{ github.workspace }}/naia-os-live-amd64.iso
          compression: squashfs

      - name: Generate Checksum
        id: checksum
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          ls -lh "$ISO_PATH"
          # An ISO that builds but is far too small means the rootfs did not
          # take. The last shipped image was 7.8GB; anything under 3GB is a
          # structural failure wearing a success exit code.
          BYTES="$(stat -c %s "$ISO_PATH")"
          test "$BYTES" -gt 3000000000 || {
            echo "::error::ISO is implausibly small ($BYTES bytes)"
            exit 1
          }
          sha256sum "$ISO_PATH" > "${ISO_PATH}-CHECKSUM"
          cat "${ISO_PATH}-CHECKSUM"
          echo "sha256=$(awk '{print $1}' < "${ISO_PATH}-CHECKSUM")" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: naia-os-live
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          retention-days: 30
          if-no-files-found: error

      # The public URL is not where a fresh ISO lands. An ISO that builds and
      # verifies can still fail to boot, or boot to a shell nobody can see —
      # and no file-level check catches that. Overwriting the public name here
      # would expose that ISO to anyone downloading before a human ever started
      # it, and unlike a container tag there is no per-machine rollback.
      #
      # So this workflow publishes to a build-specific key and stops. The
      # "Naia OS ISO promote" workflow moves a build to the public name, and a
      # person runs it after booting the thing.
      - name: Publish this build to its own key
        id: publish
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          PREFIX="builds/${{ inputs.variant || 'nvidia' }}/${{ steps.version.outputs.version }}.${{ steps.version.outputs.stamp }}"
          aws s3 cp "$ISO_PATH" "${R2_BUCKET}/${PREFIX}/${ISO_KEY}" --no-progress
          aws s3 cp "${ISO_PATH}-CHECKSUM" "${R2_BUCKET}/${PREFIX}/${ISO_KEY}-CHECKSUM" --no-progress
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "Published to ${PREFIX}/"

      # The published bytes are what a person will download and boot; the
      # runner's copy is not evidence. Comparing the checksum file's contents
      # and the ISO's Content-Length passes for any ISO of the same length, so
      # the body is streamed through sha256sum — piped, not saved, so it costs
      # no disk.
      - name: Verify the published build
        id: verify
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BASE="${R2_PUBLIC}/${{ steps.publish.outputs.prefix }}"
          BUST="?v=${{ steps.version.outputs.stamp }}"
          curl -sfL "${BASE}/${ISO_KEY}-CHECKSUM${BUST}" -o served-CHECKSUM
          SERVED_SUM="$(awk '{print $1}' < served-CHECKSUM)"
          test "$SERVED_SUM" = "${{ steps.checksum.outputs.sha256 }}" \
            || { echo "::error::Served checksum file does not match the ISO just built"; exit 1; }

          echo "Hashing the served ISO body."
          BODY_SUM="$(curl -sfL --retry 3 "${BASE}/${ISO_KEY}${BUST}" | sha256sum | awk '{print $1}')"
          echo "built:  ${{ steps.checksum.outputs.sha256 }}"
          echo "served: ${BODY_SUM}"
          test "$BODY_SUM" = "${{ steps.checksum.outputs.sha256 }}" \
            || { echo "::error::The ISO at the published URL is not the ISO that was built"; exit 1; }

      - name: Draft the ISO release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ inputs.variant || 'nvidia' }}-${{ steps.version.outputs.version }}.${{ steps.version.outputs.date }}.${{ github.run_number }}
          name: "Naia OS ${{ steps.version.outputs.version }} ${{ inputs.variant || 'nvidia' }} (Build #${{ github.run_number }}, ${{ steps.version.outputs.date }})"
          body: |
            Naia OS ${{ steps.version.outputs.version }} live ISO.

            Image: `${{ steps.image.outputs.ref }}`

            ISO: ${{ env.R2_PUBLIC }}/${{ steps.publish.outputs.prefix }}/${{ env.ISO_KEY }}
            Checksum: ${{ env.R2_PUBLIC }}/${{ steps.publish.outputs.prefix }}/${{ env.ISO_KEY }}-CHECKSUM

            **This is not the public download yet.** The public URL still serves
            the previous ISO. The bytes above were verified by downloading and
            hashing them, but nobody has booted this image.

            Boot it, and check that the Naia window is actually visible rather
            than a 1x1 stub. Then run the "Naia OS ISO promote" workflow with
            prefix `${{ steps.publish.outputs.prefix }}` to make it the public
            download.
          files: ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          draft: true
