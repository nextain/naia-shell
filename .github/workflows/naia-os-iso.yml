name: Naia OS BC250 AMD ISO candidate

# This workflow is deliberately manual. The image workflow publishes the
# candidate tag and digest first; this workflow wraps that immutable image and
# publishes only a build-specific R2 key.
on:
  workflow_dispatch:
    inputs:
      image_layer_ref:
        description: "Exact 40-character commit of nextain/naia-os supplying installer assets"
        required: true
        type: string
      candidate_tag:
        description: "Immutable AMD candidate image tag"
        required: true
        default: candidate-bc250-0.2.3-13980895
        type: string
      candidate_digest:
        description: "Digest printed by the signed candidate image workflow (sha256:...)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_REF: ghcr.io/nextain/naia-os-amd
  IMAGE_LAYER_REPO: nextain/naia-os
  CANDIDATE_TAG: ${{ inputs.candidate_tag }}
  CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
  IMAGE_LAYER_REF: ${{ inputs.image_layer_ref }}
  EXPECTED_IMAGE_LAYER_REF: 48779b61c522556ee85e1ee27b90f22b3b5e021d
  EXPECTED_TAG: candidate-bc250-0.2.3-13980895
  NAIA_VERSION: "0.2.3"
  SOURCE_BUILD: 0.2.3+13980895
  SOURCE_COMMIT: 1398089595ee1a7330f8ec1cfe387439f0807227
  ISO_NAME: naia-os-bc250-0.2.3-13980895-amd64.iso
  R2_PUBLIC: https://pub-affd0538517845d98ce44a5aec11dd98.r2.dev
  R2_BUCKET: s3://naia-releases
  TITANOBOA_REF: df63ab42567fb817eafda4296c7dcfa6a1c94b04

jobs:
  build-iso:
    name: Generate the BC250 AMD ISO candidate
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Check out the ISO workflow source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: iso-workflow

      - name: Validate candidate dispatch contract
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/build/bc250-iso-13980895) ;;
            *)
              echo "::error::candidate ISO runs must use main or build/bc250-iso-13980895 (got $GITHUB_REF)"
              exit 1
              ;;
          esac
          [[ "$IMAGE_LAYER_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::image_layer_ref must be an exact 40-character commit"
            exit 1
          }
          test "$IMAGE_LAYER_REF" = "$EXPECTED_IMAGE_LAYER_REF" || {
            echo "::error::image_layer_ref must be the reviewed nextain/naia-os commit $EXPECTED_IMAGE_LAYER_REF"
            exit 1
          }
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::candidate_digest must be a lowercase sha256 digest"
            exit 1
          }
          test "$CANDIDATE_TAG" = "$EXPECTED_TAG" || {
            echo "::error::candidate_tag must be $EXPECTED_TAG"
            exit 1
          }

      - name: Check out the pinned image layer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IMAGE_LAYER_REPO }}
          ref: ${{ inputs.image_layer_ref }}
          path: image

      - name: Validate installer assets
        working-directory: image
        run: |
          set -euo pipefail
          test -f installer/hook-post-rootfs.sh
          test -f installer/flatpaks
          test -f config/files/usr/share/naia/naia-os-version
          test -f config/files/variant/amd/usr/share/naia/image-ref
          test -f cosign.pub
          cosign_fingerprint="$(tr -d '[:space:]' < cosign.pub | md5sum | cut -c1-32)"
          test "$cosign_fingerprint" = "54f58f952bf8d55bf008e49b9933be7e" || {
            echo "::error::cosign.pub fingerprint mismatch ($cosign_fingerprint)"
            exit 1
          }
          echo "Using nextain/naia-os installer assets from $IMAGE_LAYER_REF"

      - name: Set candidate build metadata
        id: meta
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          prefix="builds/amd/0.2.3.${stamp}-13980895"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "Candidate R2 prefix: $prefix"

      - name: Resolve and compare candidate image references
        id: image
        run: |
          set -euo pipefail
          candidate_ref="${IMAGE_REF}:${CANDIDATE_TAG}"
          tag_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${candidate_ref}")"
          test "$tag_digest" = "$CANDIDATE_DIGEST" || {
            echo "::error::candidate tag resolves to $tag_digest, not $CANDIDATE_DIGEST"
            exit 1
          }
          echo "container_ref=$candidate_ref" >> "$GITHUB_OUTPUT"
          echo "live_ref=${IMAGE_REF}@${CANDIDATE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "container-image=${candidate_ref}"
          echo "image-ref=${IMAGE_REF}@${CANDIDATE_DIGEST}"

      - name: Verify the candidate image payload
        env:
          LIVE_IMAGE: ${{ steps.image.outputs.live_ref }}
        run: |
          set -euo pipefail
          podman run --rm --entrypoint /bin/bash "$LIVE_IMAGE" -c '
            set -euo pipefail
            test "$(tr -d "[:space:]" < /usr/share/naia/naia-os-version)" = "0.2.3"
            grep -Fqx "PRETTY_NAME=\"Naia OS 0.2.3 (Bazzite)\"" /usr/lib/os-release
            test "$(tr -d "[:space:]" < /usr/share/naia/source-build-manifest)" = "0.2.3+13980895"
            jq -e ".source_build == \"0.2.3+13980895\" and .source_commit == \"1398089595ee1a7330f8ec1cfe387439f0807227\"" \
              /usr/share/naia/source-build-manifest.json >/dev/null
            test "$(rpm -q --qf "%{NAME} %{VERSION} %{RELEASE} %{ARCH}" naia)" = "naia 0.2.3 1 x86_64"
            test "$(tr -d "[:space:]" < /usr/share/naia/image-ref)" = "ghcr.io/nextain/naia-os-amd"
            /usr/libexec/naia-verify-image
          '

      - name: Install cosign verifier
        uses: sigstore/cosign-installer@v3.8.1

      - name: Verify the signed candidate image
        env:
          LIVE_IMAGE: ${{ steps.image.outputs.live_ref }}
        run: |
          set -euo pipefail
          cosign verify --key image/cosign.pub \
            --insecure-ignore-tlog "$LIVE_IMAGE"

      - name: Generate the candidate post-rootfs hook
        env:
          HELPER: ${{ github.workspace }}/iso-workflow/.github/scripts/bc250-candidate-iso-prepare-hook.py
          SOURCE_HOOK: ${{ github.workspace }}/image/installer/hook-post-rootfs.sh
          CANDIDATE_HOOK: ${{ github.workspace }}/image/installer/hook-post-rootfs-bc250-candidate.sh
        run: |
          set -euo pipefail
          python3 "$HELPER" "$SOURCE_HOOK" "$CANDIDATE_HOOK" \
            "$IMAGE_REF" "$CANDIDATE_TAG" "$CANDIDATE_DIGEST"
          bash -n "$CANDIDATE_HOOK"
          grep -Eq 'NAIA_CANDIDATE_(IMAGE|TAG|DIGEST)|embedded candidate|ostreecontainer --url|container-image-reference' \
            "$CANDIDATE_HOOK"
          grep -Fq "$CANDIDATE_TAG" "$CANDIDATE_HOOK"
          grep -Fq "$CANDIDATE_DIGEST" "$CANDIDATE_HOOK"

      - name: Build ISO with the pinned candidate image
        id: build
        uses: nextain/titanoboa@df63ab42567fb817eafda4296c7dcfa6a1c94b04
        with:
          image-ref: ${{ steps.image.outputs.live_ref }}
          container-image: ${{ steps.image.outputs.container_ref }}
          hook-post-rootfs: ${{ github.workspace }}/image/installer/hook-post-rootfs-bc250-candidate.sh
          flatpaks-list: ${{ github.workspace }}/image/installer/flatpaks
          iso-dest: ${{ github.workspace }}/${{ env.ISO_NAME }}
          compression: squashfs

      - name: Checksum and record the candidate receipt
        id: checksum
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          LIVE_IMAGE: ${{ steps.image.outputs.live_ref }}
          CONTAINER_IMAGE: ${{ steps.image.outputs.container_ref }}
          IMAGE_LAYER_COMMIT: ${{ inputs.image_layer_ref }}
          R2_PREFIX: ${{ steps.meta.outputs.prefix }}
        run: |
          set -euo pipefail
          test -f "$ISO_PATH"
          bytes="$(stat -c %s "$ISO_PATH")"
          test "$bytes" -gt 3000000000 || {
            echo "::error::ISO is implausibly small ($bytes bytes)"
            exit 1
          }
          sha256="$(sha256sum "$ISO_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "$(basename "$ISO_PATH")" > "${ISO_PATH}-CHECKSUM"
          jq -n \
            --arg product naia-os \
            --arg variant amd \
            --arg hardware_target BC250 \
            --arg version "$NAIA_VERSION" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_build "$SOURCE_BUILD" \
            --arg image_layer_repo "$IMAGE_LAYER_REPO" \
            --arg image_layer_commit "$IMAGE_LAYER_COMMIT" \
            --arg image_ref "$LIVE_IMAGE" \
            --arg container_image "$CONTAINER_IMAGE" \
            --arg candidate_tag "$CANDIDATE_TAG" \
            --arg candidate_digest "$IMAGE_DIGEST" \
            --arg titanoboa_ref "$TITANOBOA_REF" \
            --arg iso_file "$(basename "$ISO_PATH")" \
            --arg iso_sha256 "$sha256" \
            --arg r2_prefix "$R2_PREFIX" \
            --argjson iso_bytes "$bytes" \
            '{product:$product, variant:$variant, hardware_target:$hardware_target,
              version:$version, source_commit:$source_commit, source_build:$source_build,
              image_layer_repo:$image_layer_repo, image_layer_commit:$image_layer_commit,
              image_ref:$image_ref, container_image:$container_image,
              candidate_tag:$candidate_tag, candidate_digest:$candidate_digest,
              titanoboa_ref:$titanoboa_ref, iso_file:$iso_file, iso_bytes:$iso_bytes,
              iso_sha256:$iso_sha256, r2_prefix:$r2_prefix,
              candidate_only:true, hardware_boot_validation:"unverified"}' \
            > candidate-build-receipt.json
          jq empty candidate-build-receipt.json
          cat "${ISO_PATH}-CHECKSUM"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

      - name: Install ISO metadata validator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso

      - name: Verify BIOS and UEFI boot metadata
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
        run: |
          set -euo pipefail
          xorriso -indev "$ISO_PATH" -report_el_torito plain -report_system_area plain \
            2>&1 | tee iso-boot-report.txt
          bios_boot_images="$(grep -Eic '^ *El Torito boot img *: *[0-9]+[[:space:]]+BIOS[[:space:]]+y([[:space:]]|$)' iso-boot-report.txt || true)"
          test "$bios_boot_images" -ge 1 || {
            echo "::error::ISO is missing a bootable BIOS El Torito image row"
            exit 1
          }
          uefi_boot_images="$(grep -Eic '^ *El Torito boot img *: *[0-9]+[[:space:]]+UEFI[[:space:]]+y([[:space:]]|$)' iso-boot-report.txt || true)"
          test "$uefi_boot_images" -ge 1 || {
            echo "::error::ISO is missing a bootable UEFI El Torito image row"
            exit 1
          }

      - name: Upload candidate ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: naia-os-bc250-0.2.3-13980895-amd64-${{ github.run_id }}
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
            candidate-build-receipt.json
            iso-boot-report.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish candidate to a build-specific R2 key
        id: publish
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/bc250-iso-13980895'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
          R2_PREFIX: ${{ steps.meta.outputs.prefix }}
        run: |
          set -euo pipefail
          aws s3 cp "$ISO_PATH" "${R2_BUCKET}/${R2_PREFIX}/${ISO_NAME}" --no-progress
          aws s3 cp "${ISO_PATH}-CHECKSUM" "${R2_BUCKET}/${R2_PREFIX}/${ISO_NAME}-CHECKSUM" --no-progress
          aws s3 cp candidate-build-receipt.json "${R2_BUCKET}/${R2_PREFIX}/build-receipt.json" --no-progress
          echo "prefix=$R2_PREFIX" >> "$GITHUB_OUTPUT"
          echo "iso_url=${R2_PUBLIC}/${R2_PREFIX}/${ISO_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum_url=${R2_PUBLIC}/${R2_PREFIX}/${ISO_NAME}-CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Verify the served candidate bytes
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/bc250-iso-13980895'
        env:
          R2_PREFIX: ${{ steps.publish.outputs.prefix }}
          EXPECTED_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          base="${R2_PUBLIC}/${R2_PREFIX}"
          curl -sfL "${base}/${ISO_NAME}-CHECKSUM?v=${GITHUB_RUN_ID}" -o served-CHECKSUM
          served_sum="$(awk '{print $1}' < served-CHECKSUM)"
          test "$served_sum" = "$EXPECTED_SHA256" || {
            echo "::error::served checksum file does not match the built ISO"
            exit 1
          }
          body_sum="$(curl -sfL --retry 3 "${base}/${ISO_NAME}?v=${GITHUB_RUN_ID}" | sha256sum | awk '{print $1}')"
          test "$body_sum" = "$EXPECTED_SHA256" || {
            echo "::error::served ISO body does not match the built ISO"
            exit 1
          }
          echo "ISO: ${base}/${ISO_NAME}"
          echo "CHECKSUM: ${base}/${ISO_NAME}-CHECKSUM"
          echo "RECEIPT: ${base}/build-receipt.json"
