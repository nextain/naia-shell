name: Naia OS BC250 candidate image

# This file keeps the registered workflow path but is deliberately candidate
# only. A successful run must not satisfy a workflow_run trigger that builds
# the production/NVIDIA ISO, and it must never move a production tag.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  candidate-image:
    name: Build and sign the BC250 0.2.3 candidate image
    runs-on: ubuntu-24.04
    outputs:
      image_ref: ${{ steps.candidate.outputs.image_ref }}
      image_tag: ${{ steps.candidate.outputs.image_tag }}
      image_digest: ${{ steps.candidate.outputs.image_digest }}

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the pinned image layer
        uses: actions/checkout@v4
        with:
          repository: nextain/naia-os
          ref: b3da54785f9fa5c17b111525212f28c20418df95
          path: image

      - name: Install image build tools
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for command in jq podman rpm skopeo; do
            command -v "$command" >/dev/null 2>&1 || missing+=("$command")
          done
          if ((${#missing[@]})); then
            echo "Installing missing image tools: ${missing[*]}"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq podman rpm skopeo
          fi
          for command in jq podman rpm skopeo; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "::error::required image tool is unavailable: $command"
              exit 1
            }
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Build, publish and verify the candidate
        id: candidate
        env:
          BASE_IMAGE: ghcr.io/nextain/naia-os-amd@sha256:5bf36115118aa8099aed8760b0b6bfd4dd9e1122a7a5f2e8e8b772a97a13c474
          IMAGE_REF: ghcr.io/nextain/naia-os-amd
          IMAGE_TAG: candidate-bc250-0.2.3-13980895-support2
          RPM_URL: https://github.com/nextain/naia-shell/releases/download/bc250-20260908-13980895/Naia-0.2.3-1.x86_64.rpm
          RPM_SHA256: 1e912b1c87e84e1ae1094a1943e88c71e6688b010c19f3ded9b69a3c72f189ad
          SOURCE_COMMIT: 1398089595ee1a7330f8ec1cfe387439f0807227
          NAIA_VERSION: "0.2.3"
          SOURCE_BUILD: 0.2.3+13980895
          REGISTRY_TOKEN: ${{ github.token }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          IMAGE_LAYER_DIR: ${{ github.workspace }}/image
        run: .github/scripts/bc250-candidate-image.sh

      - name: Upload candidate receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: naia-os-bc250-0.2.3-image-receipt
          path: ${{ github.workspace }}/candidate-image-receipt.json
          if-no-files-found: error
          retention-days: 30
