pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # This server never pulls models; upstream browser WebGPU may download its own.
        location = /healthz { default_type text/plain; return 200 'ok\n'; }
        location ~ ^/local-llm/v1/(models|chat/completions)$ {
            if ($request_method !~ ^(GET|POST)$) { return 405; }
            set $inference http://127.0.0.1:11434;
            rewrite ^/local-llm/(.*)$ /$1 break;
            proxy_pass $inference;
            proxy_connect_timeout 3s;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Origin "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 2m;
        }
        location /local-llm/ { return 404; }
        # Alpine nginx does not map .mjs by default; PDF module workers require JavaScript MIME.
        location ~ \.mjs$ { types { application/javascript mjs; } try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
