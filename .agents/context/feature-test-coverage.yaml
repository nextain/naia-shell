critical_regressions:
  - id: naia-shell:regression:host-voice-download-manifest
    protects: [REQ-003, REQ-011, REQ-015]
    behavior: "A GPU-qualified onboarding user can enable Naia Host from a development or packaged build using a validated download manifest."
    tests:
      - { tier: deterministic_ci, path: packages/shell/scripts/__tests__/stage-voxcpm2-runtime.test.ts }
      - { tier: deterministic_ci, path: packages/shell/scripts/__tests__/platform-matrix.test.ts }
      - { tier: credentialed_live, evidence: "The 0.2.2 public archive returns HTTP 200 with the manifest-pinned byte length." }
    residual: "A clean-machine GPU installation and audible synthesis remain native release checks."
  - id: naia-shell:regression:nextain-azure-stream-options
    protects: [REQ-001, REQ-009, REQ-018]
    behavior: "Nextain Azure models accept the OpenAI-compatible streaming request without terminating the response, and return text plus token usage."
    tests:
      - { tier: deterministic_ci, path: ../project-any-llm/tests/unit/providers/test_azure_provider.py }
      - { tier: deterministic_ci, path: ../project-any-llm/tests/gateway/test_naia_azure_models.py }
      - { tier: credentialed_live, evidence: "Development and production gateway probes use deepseek-v4-flash and require a non-empty streamed reply and usage." }
    residual: "The live probe is an opt-in deployment gate because it consumes provider tokens."

notes:
  - "Detailed user journeys S01-S72 remain in docs/user-scenarios.md; this file is the current coverage index."
  - "A passing mocked journey does not replace credentialed native or release-artifact validation."
