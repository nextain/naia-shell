id: naia-shell:feature-test-coverage
title: Naia Shell feature and regression coverage
tags: [naia-shell, quality, regression, microsoft-store, dual-context]

# 2026-09-05: 품질 프로세스가 신설되면서 이 파일 밖에 자산이 생겼다. 여기만
# 보고 "회귀는 이게 전부" 라고 읽지 않도록 자리를 적어 둔다.
quality_process:
  document: docs/quality-process.md
  gates: scripts/check-*.mjs  # self-trust-gates.yml 이 전부 부른다
  multi_machine_qa:
    roster: docs/regression-runs/machines.json
    joining: docs/regression-runs/JOINING.md
    channel: docs/regression-runs/CHANNEL.md
    runner: scripts/run-regression.mjs
    completeness: scripts/check-regression-complete.mjs
    note: |
      실기 스펙은 한 기계가 다 돌 수 없다. 자격증명이 필요한 것이 대부분이고
      장치가 필요한 것도 있다. 기계마다 능력이 다르므로 맡는 등급이 다르고,
      러너가 명단을 읽어 등급마다 그 등급을 맡은 기계들끼리 나눈다.
      실패가 회귀인지 기계 능력인지 가르는 것이 마스터의 일이다.
related:
  - docs/requirements.md
  - docs/user-scenarios.md
  - docs/quality-process.md
  - docs/e2e-inventory.json
  - packages/shell/e2e/store-certification.spec.ts
updated_at: 2026-09-11
source: user-directive-2026-08-27
version: 2

coverage_tiers:
  deterministic_ci: "Runs without credentials and must pass on every pull request."
  browser_mock: "Playwright user journey with controlled Tauri and provider boundaries."
  native_local: "Packaged or tauri-driver journey against the real desktop boundary."
  credentialed_live: "Opt-in provider or service test requiring a secret/account/device."
  manual_package: "Release artifact inspection that cannot be proven by browser mocks."

commands:
  quick_store: "pnpm -C packages/shell test:regression:store"
  shell_unit: "pnpm -C packages/shell test"
  browser_full: "pnpm -C packages/shell test:e2e"
  native_full: "pnpm -C packages/shell test:e2e:tauri"
  native_store: "pnpm -C packages/shell test:regression:store:native"
  build: "pnpm -C packages/shell build"
  # 배포 전 회귀를 여러 기계로 나눠 돌리고 빈 곳을 찾는다. 등급 이름은 위
  # coverage_tiers 와 같은 것을 쓴다 — docs/e2e-inventory.json 이 실기 스펙
  # 하나하나에 그 등급을 매겨 둔다.
  regression_run: "node scripts/run-regression.mjs --machine=<이름> --tier=deterministic_ci"
  regression_complete: "node scripts/check-regression-complete.mjs --max-age-hours=24"
  inventory_refresh: "node scripts/build-e2e-inventory.mjs"

# 숫자가 거짓말하지 않게 하는 게이트. 전부 CI 에서 돌고 LLM 을 부르지 않는다.
# 자세한 것은 docs/quality-process.md 를 보라.
gates:
  - { script: scripts/check-uc-traceability.mjs, guards: "UC 가 어디서 검증되는지 안 적힌 채 늘어나는 것" }
  - { script: scripts/check-vacuous-tests.mjs, guards: "아무것도 재지 않는 통과와 이유 없는 skip 이 늘어나는 것" }
  - { script: scripts/check-untranslated-ui.mjs, guards: "화면에 박힌 한국어가 늘어나는 것" }
  - { script: "scripts/build-e2e-inventory.mjs --check", guards: "실기 스펙 요구조건 목록이 낡는 것" }
  - { script: packages/shell/scripts/check-bundle-budget.mjs, guards: "진입 번들과 배포본이 정한 크기를 넘는 것" }

