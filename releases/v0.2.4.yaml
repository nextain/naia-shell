version: "0.2.4"
date: "2026-10-04"
# 이번 배포가 나가는 운영체제. 배포 전 회귀(scripts/check-regression-complete.mjs)가
# 이 운영체제의 기계와 스펙만 조건으로 삼는다 — scripts/lib/release-target.mjs.
targets: [windows]
summary:
  en: "Windows signing and credits release: the installed naia-shell.exe now keeps a valid Authenticode signature, Naia usage cost is shown in credits, and the Steam build hides top-up and payment links. Also pairs naia-agent 3b0e101 for knowledge recall."
  ko: "윈도우 서명·크레딧 릴리스입니다. 설치된 naia-shell.exe 의 Authenticode 서명이 유효하게 남고, 나이아 사용 비용을 크레딧으로 보여 주며, Steam 판에서는 충전·결제 링크를 숨깁니다. 지식 회상을 위해 naia-agent 3b0e101 과 짝을 맞춥니다."
changes:
  - type: fix
    scope: release
    issue: 725
    description:
      en: "Sign naia-shell.exe after Tauri patches the bundle type so the installed app no longer fails Authenticode with HashMismatch; verify the app, MSI and Steam depot executables in CI."
      ko: "Tauri 가 번들 형식을 고친 뒤에 naia-shell.exe 를 서명해 설치된 앱이 Authenticode HashMismatch 로 실패하지 않게 하고, CI 에서 앱·MSI·Steam 디포 실행 파일 서명을 확인합니다."
  - type: feature
    scope: shell
    issue: 727
    description:
      en: "Show Naia usage cost in credits, and show credit amounts of 1,000 or more as K."
      ko: "나이아 사용 비용을 크레딧으로 보여 주고, 1,000 크레딧 이상은 K 로 줄여 표시합니다."
  - type: fix
    scope: shell
    issue: 727
    description:
      en: "Hide top-up, donation, sponsor and store links on the Steam build, and treat an unknown distribution channel as hidden."
      ko: "Steam 판에서 충전·후원·스폰서·스토어 링크를 숨기고, 배포 채널을 알 수 없으면 숨김으로 처리합니다."
  - type: fix
    scope: agent
    description:
      en: "Pair naia-agent 3b0e101 and naia-kb-compiler 24f52c1 so saved knowledge can be recalled."
      ko: "저장한 지식을 다시 불러올 수 있도록 naia-agent 3b0e101 · naia-kb-compiler 24f52c1 과 짝을 맞춥니다."
